name: Build debug APK

on:
  push:
    branches: [ "claude/build-apk-*", "claude/project-thread-*" ]
  workflow_dispatch:

permissions:
  contents: write   # 上傳 APK 到 kebbi-latest release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0" > /dev/null
      - name: Build
        run: bash ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kebbi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # 固定網址給 Kebbi「從網址安裝」：每次編譯覆蓋同一個 release 的 kebbi.apk
      # https://github.com/<owner>/<repo>/releases/download/kebbi-latest/kebbi.apk
      - name: Publish to kebbi-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk kebbi.apk
          gh release view kebbi-latest >/dev/null 2>&1 || \
            gh release create kebbi-latest --prerelease --title "Kebbi APK（最新編譯）" \
              --notes "Kebbi 上用「從網址安裝」：https://github.com/${{ github.repository }}/releases/download/kebbi-latest/kebbi.apk" \
              --target "${{ github.sha }}"
          gh release upload kebbi-latest kebbi.apk --clobber
